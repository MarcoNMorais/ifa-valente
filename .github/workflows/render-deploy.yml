name: Deploy Render

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'EstoqueHospital/**'
      - '**/dados.json'
      - '**/dados_relatorios.json'
      - '**/*.db'
      - '**/backups/**'
      - '**/persistent/**'
      - '**/__pycache__/**'
      - '**/*.log'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: curl -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
