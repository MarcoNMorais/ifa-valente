<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff6d7">
<title>Mensagem do Dia | Saúde Valente</title>
<style>
:root{--azul:#073d7c;--amarelo:#f5b900;--creme:#fff6d7;--texto:#17263a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;background:#fff6d7;color:var(--texto)}
.page{height:100dvh;min-height:100svh;max-width:760px;margin:auto;position:relative;overflow:hidden;padding:max(8px,env(safe-area-inset-top)) 16px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,#fff9e8 0%,#fff2c4 100%)}
.page:before{content:"";position:absolute;width:260px;height:260px;border:2px solid rgba(245,185,0,.25);border-radius:50%;left:-185px;top:-185px}.dots{position:absolute;right:15px;top:20px;width:75px;height:75px;opacity:.35;background-image:radial-gradient(#e4ad00 2px,transparent 2.5px);background-size:15px 15px}
.logo{position:relative;z-index:3;width:min(330px,68vw);height:auto;max-height:16vh;object-fit:contain;display:block;margin:0 auto 5px;mix-blend-mode:multiply}
.hero{position:relative;z-index:3;width:100%;text-align:center}.hero h1{margin:0;color:var(--azul);font-weight:950;font-size:clamp(35px,9.5vw,64px);line-height:.91;letter-spacing:-.045em;text-transform:uppercase}.hero h1 span{display:block}.rule{display:flex;align-items:center;gap:10px;width:min(520px,82vw);margin:7px auto 5px}.rule:before,.rule:after{content:"";height:2px;background:var(--amarelo);flex:1}.rule b{font-size:22px;color:var(--amarelo)}.subtitle{margin:0;color:var(--azul);font-size:clamp(18px,4.7vw,28px);font-weight:900;line-height:1.05}.support{margin:4px 0 0;color:var(--azul);font-size:clamp(11px,2.9vw,16px)}
.ribbon{position:absolute;z-index:1;left:-40px;top:35%;width:245px;height:330px;transform:rotate(-8deg);opacity:.9}.ribbon:before,.ribbon:after{content:"";position:absolute;background:linear-gradient(90deg,#f1a900,#ffd84e,#e8a000);border-radius:60% 25% 60% 25%;box-shadow:0 8px 12px rgba(139,91,0,.12)}.ribbon:before{width:55px;height:330px;left:75px;top:0;transform:rotate(-28deg)}.ribbon:after{width:52px;height:300px;left:90px;top:15px;transform:rotate(31deg)}
.card{position:relative;z-index:4;width:min(650px,97%);margin-top:clamp(8px,1.4vh,15px);background:rgba(255,255,255,.91);border:1px solid rgba(222,165,0,.55);border-radius:25px;padding:10px 14px 10px;box-shadow:0 10px 26px rgba(113,80,0,.10)}.card-title{display:flex;align-items:center;gap:10px;color:var(--azul);font-size:clamp(18px,4.5vw,27px);font-weight:900;margin-bottom:7px;white-space:nowrap}.card-title:before,.card-title:after{content:"";height:2px;background:var(--amarelo);flex:1}.quote{position:relative;height:clamp(155px,27vh,245px);border:1px solid rgba(222,165,0,.55);border-radius:21px;background:linear-gradient(145deg,#fffdf4,#ffeaa2);display:flex;align-items:center;justify-content:center;padding:25px 22px 18px;overflow:hidden}.quote:before{content:'“';position:absolute;left:20px;top:0;color:var(--amarelo);font:800 58px/1 Georgia,serif}#message{margin:0;max-width:550px;text-align:center;font-size:clamp(20px,5.2vw,32px);font-weight:900;line-height:1.14;letter-spacing:-.02em}#message.medium{font-size:clamp(17px,4.6vw,27px)}#message.long{font-size:clamp(14px,3.9vw,22px)}.tomorrow{text-align:center;color:#696969;margin:7px 0 0;font-size:clamp(10px,2.8vw,14px)}.brandline{position:relative;z-index:4;color:var(--azul);font-weight:800;text-align:center;margin-top:6px;font-size:clamp(9px,2.6vw,13px)}
.footer{position:absolute;z-index:2;left:-4%;right:-4%;bottom:-25px;height:72px;background:var(--azul);transform:rotate(-1.5deg)}.footer:before{content:"";position:absolute;left:-5%;top:-18px;width:68%;height:35px;background:var(--amarelo);transform:rotate(3deg)}
@media(max-width:430px){.page{padding-left:8px;padding-right:8px}.logo{width:min(290px,70vw);max-height:15vh}.hero h1{font-size:clamp(34px,10vw,44px)}.subtitle{font-size:18px}.support{font-size:11px}.rule{margin:5px auto 3px}.card{padding:9px 10px 8px;margin-top:8px;border-radius:22px}.card-title{font-size:19px;margin-bottom:6px}.quote{height:clamp(150px,26vh,215px);padding:22px 13px 15px}#message{font-size:clamp(20px,6vw,27px)}#message.medium{font-size:clamp(17px,5vw,22px)}#message.long{font-size:clamp(14px,4.1vw,18px)}.ribbon{left:-76px;top:38%;transform:scale(.82) rotate(-8deg)}}
@media(max-height:760px){.logo{max-height:13vh;width:250px}.hero h1{font-size:32px}.subtitle{font-size:15px}.support{font-size:10px}.card{margin-top:6px}.quote{height:23vh;min-height:125px}.tomorrow{font-size:10px}.brandline{font-size:9px}}
</style>
</head>
<body>
<main class="page">
<div class="dots"></div>
<img class="logo" src="{{ url_for('static', filename='logo-saude-valente.jpg') }}?v=oficial2" alt="Secretaria da Saúde - Prefeitura de Valente">
<section class="hero"><h1><span>SETEMBRO</span><span>AMARELO</span></h1><div class="rule"><b>♥</b></div><p class="subtitle">Prevenção do suicídio<br>e valorização da vida</p><p class="support">Você importa. Sua vida tem valor. <strong>Estamos com você.</strong></p></section>
<div class="ribbon" aria-hidden="true"></div>
<section class="card"><div class="card-title">Sua mensagem do dia</div><div class="quote"><p id="message">Carregando sua mensagem...</p></div><p class="tomorrow">Amanhã você recebe uma nova mensagem.</p></section>
<div class="brandline">Secretaria da Saúde · Prefeitura de Valente</div><div class="footer"></div>
</main>
<script>
const messages={{ messages|tojson }};const el=document.getElementById('message');
function key(){let k=localStorage.getItem('mensagem_device_key');if(!k){k=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now());localStorage.setItem('mensagem_device_key',k)}return k}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
if(messages.length){const m=messages[hash(key()+'|'+day)%messages.length].text;el.textContent=m;el.className=m.length>190?'long':m.length>125?'medium':''}else el.textContent='Você importa. Sua vida tem valor.';
</script>
</body></html>
