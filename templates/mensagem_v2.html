<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff4c8">
<title>Mensagem do Dia | Saúde Valente</title>
<style>
:root{--blue:#083b79;--blue2:#0b4c93;--gold:#f1b900;--gold2:#ffc928;--cream:#fff8df;--paper:#fffdf6;--ink:#162437}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 96% 8%,rgba(242,185,0,.18) 0 3px,transparent 4px) 0 0/26px 26px,linear-gradient(180deg,#fffdf4 0%,#fff5c9 100%)}
.poster{height:100dvh;min-height:100svh;width:100%;position:relative;overflow:hidden;display:flex;justify-content:center;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.poster:before{content:"";position:absolute;width:34vmax;height:34vmax;border:2px solid rgba(241,185,0,.38);border-radius:50%;left:-22vmax;top:-22vmax;box-shadow:0 0 0 18px rgba(241,185,0,.04)}
.poster:after{content:"";position:absolute;width:42vmax;height:14vmax;background:linear-gradient(90deg,#f4b900,#ffcf27 58%,#083b79 59%,#083b79);border-radius:50%;bottom:-10vmax;right:-9vmax;transform:rotate(-6deg);opacity:.95}
.shell{position:relative;z-index:2;width:min(700px,100%);height:100%;display:grid;grid-template-rows:auto auto auto 1fr auto;align-items:center;gap:clamp(4px,1vh,10px)}
.brand{display:flex;justify-content:center;align-items:center;min-height:0}.brand img{display:block;width:min(310px,62vw);max-height:15.5vh;object-fit:contain;border-radius:8px}
.head{text-align:center;position:relative}.ribbon-small{font-size:clamp(20px,4.8vh,42px);line-height:1;margin-bottom:2px;filter:drop-shadow(0 2px 3px rgba(145,95,0,.14))}
.title{margin:0;color:var(--blue);font-weight:950;line-height:.88;letter-spacing:-.04em;text-transform:uppercase;font-size:clamp(35px,8.2vw,76px)}.title .yellow{color:#efa900}
.rule{width:min(360px,62vw);height:8px;margin:clamp(4px,.7vh,8px) auto 0;display:flex;align-items:center;gap:8px}.rule:before,.rule:after{content:"";height:2px;background:#e9b516;flex:1}.rule span{color:#efb300;font-size:18px;line-height:1}
.subtitle{text-align:center;color:var(--blue);font-weight:850;line-height:1.08;font-size:clamp(18px,4.8vw,32px)}.subtitle .soft{display:block;font-weight:600;font-size:.62em;margin-top:clamp(2px,.4vh,5px)}
.card{position:relative;align-self:stretch;justify-self:stretch;background:rgba(255,255,255,.94);border:1px solid rgba(240,186,11,.45);border-radius:clamp(22px,4vw,34px);box-shadow:0 18px 46px rgba(106,79,0,.13);padding:clamp(12px,2.2vh,22px);display:flex;flex-direction:column;min-height:0}
.card-title{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--blue);font-size:clamp(18px,4.8vw,30px);font-weight:900;margin-bottom:clamp(7px,1vh,12px)}.card-title:before,.card-title:after{content:"";height:2px;background:#efb300;flex:1;max-width:120px}
.message-box{position:relative;flex:1;min-height:0;border:1px solid rgba(240,186,11,.6);border-radius:clamp(18px,3.4vw,28px);background:linear-gradient(135deg,#fff9e7,#ffefad);display:flex;align-items:center;justify-content:center;padding:clamp(18px,3.2vh,34px) clamp(16px,5vw,34px);overflow:hidden}
.message-box:before{content:"“";position:absolute;left:clamp(15px,3vw,24px);top:clamp(2px,.5vh,8px);font:900 clamp(50px,8vh,78px)/1 Georgia,serif;color:#efb300}.message-box:after{content:"🎗";position:absolute;right:-12px;bottom:-26px;font-size:clamp(70px,14vh,145px);opacity:.07;transform:rotate(-10deg)}
#message{position:relative;z-index:1;margin:0;text-align:center;color:#17263a;font-weight:900;line-height:1.18;letter-spacing:-.025em;font-size:clamp(21px,5.4vw,39px);max-width:620px}.tomorrow{text-align:center;margin:clamp(7px,1vh,11px) 0 0;color:#5e6570;font-size:clamp(11px,2.8vw,16px)}
.footer{text-align:center;color:var(--blue);font-size:clamp(11px,2.7vw,15px);font-weight:650;line-height:1.15;padding-bottom:2px}.footer strong{font-weight:900}.decor-ribbon{position:absolute;z-index:1;left:-4vmax;bottom:3vh;font-size:clamp(110px,25vh,240px);opacity:.18;transform:rotate(9deg);filter:saturate(1.1)}
@media (max-height:740px){.shell{gap:3px;grid-template-rows:auto auto auto 1fr auto}.brand img{max-height:12.5vh;width:min(270px,58vw)}.ribbon-small{font-size:28px}.title{font-size:clamp(30px,7.5vw,58px)}.subtitle{font-size:clamp(16px,4vw,25px)}.card{padding:10px 12px}.card-title{font-size:clamp(16px,4vw,23px);margin-bottom:6px}.message-box{padding:20px 16px}#message{font-size:clamp(19px,4.8vw,30px);line-height:1.14}.tomorrow{margin-top:6px}.footer{font-size:11px}}
@media (max-height:620px){.brand img{max-height:10vh;width:min(230px,52vw)}.ribbon-small{display:none}.rule{display:none}.subtitle .soft{display:none}.card-title:before,.card-title:after{display:none}.decor-ribbon{display:none}}
@media (min-width:800px){.shell{width:min(820px,92vw)}.brand img{width:340px}.card{max-width:760px;justify-self:center;width:100%}.poster:after{height:11vmax}}
</style>
</head>

<script>
const messages={{ messages|tojson }};const el=document.getElementById("message");function deviceId(){let x=localStorage.getItem("valente_msg_device");if(!x){x=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():"dev-"+Date.now()+"-"+Math.random();localStorage.setItem("valente_msg_device",x)}return x}function dayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}const today=dayKey(),key="valente_msg_daily_"+today;let saved=null;try{saved=JSON.parse(localStorage.getItem(key))}catch(e){}if(saved&&saved.text){el.textContent=saved.text}else if(messages.length){const chosen=messages[hash(deviceId()+"|"+today)%messages.length];el.textContent=chosen.text;localStorage.setItem(key,JSON.stringify(chosen))}else{el.textContent="Você importa. Cuide de você e permita-se receber cuidado também."}
</script>
