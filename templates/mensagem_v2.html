<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Mensagem do Dia | Saúde Valente</title>
<style>
:root{--azul:#073b79;--azul2:#0a4a8d;--amarelo:#f6b800;--amarelo2:#ffd34a;--creme:#fff3c7;--creme2:#fff9e7;--texto:#15263c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#fff7db 0%,#fff0bd 100%);color:var(--texto)}
.page{position:relative;width:min(760px,100%);height:100dvh;min-height:100svh;margin:auto;overflow:hidden;padding:max(8px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.page:before{content:"";position:absolute;width:260px;height:260px;border:2px solid rgba(239,176,0,.34);border-radius:50%;left:-180px;top:-170px;box-shadow:0 0 0 18px rgba(239,176,0,.05)}
.dots{position:absolute;right:18px;top:24px;width:76px;height:76px;opacity:.45;background-image:radial-gradient(#eab51c 2px,transparent 2.5px);background-size:16px 16px}
.logo{position:relative;z-index:3;width:min(330px,67vw);height:auto;display:block;margin:2px auto 4px;border-radius:8px;mix-blend-mode:multiply}
.hero{position:relative;z-index:4;text-align:center;width:100%;margin-top:2px}.hero h1{margin:0;font-weight:950;line-height:.88;letter-spacing:-.045em;color:var(--azul);text-transform:uppercase;font-size:clamp(38px,10.2vw,72px)}.hero h1 span{display:block;color:var(--azul)}
.rule{display:flex;align-items:center;gap:10px;width:min(520px,80vw);margin:8px auto 5px}.rule:before,.rule:after{content:"";height:2px;background:#e7b01a;flex:1}.rule b{color:#efb100;font-size:22px;line-height:1}
.subtitle{margin:0;color:var(--azul);font-size:clamp(19px,4.7vw,31px);font-weight:850;line-height:1.08}.support{margin:5px 0 0;color:var(--azul);font-size:clamp(12px,3vw,17px);line-height:1.15}.support strong{font-weight:900}
.ribbon-art{position:absolute;z-index:1;left:-52px;top:34%;width:min(430px,74vw);height:50%;pointer-events:none;filter:drop-shadow(0 12px 10px rgba(151,102,0,.18));opacity:.96}
.card{position:relative;z-index:5;width:min(660px,96%);margin-top:clamp(10px,1.7vh,18px);background:rgba(255,255,255,.88);border:1px solid rgba(229,170,0,.5);border-radius:28px;padding:12px 16px 12px;box-shadow:0 14px 35px rgba(110,78,0,.12)}
.card-title{display:flex;align-items:center;gap:10px;color:var(--azul);font-size:clamp(18px,4.4vw,28px);font-weight:900;margin-bottom:8px;white-space:nowrap}.card-title:before,.card-title:after{content:"";height:2px;background:#e7b01a;flex:1}
.quote{position:relative;min-height:155px;max-height:31vh;border:1px solid rgba(229,170,0,.48);border-radius:22px;background:linear-gradient(145deg,rgba(255,252,239,.96),rgba(255,232,145,.9));display:flex;align-items:center;justify-content:center;padding:24px 24px 20px;overflow:hidden}.quote:before{content:'“';position:absolute;left:20px;top:1px;color:#efb100;font:800 58px/1 Georgia,serif}
#message{position:relative;z-index:2;margin:0;max-width:560px;text-align:center;color:#17263a;font-weight:900;line-height:1.16;letter-spacing:-.02em;font-size:clamp(21px,5.3vw,34px)}#message.medium{font-size:clamp(18px,4.7vw,28px)}#message.long{font-size:clamp(15px,4vw,23px)}
.tomorrow{text-align:center;margin:7px 0 0;color:#6b6d6b;font-size:clamp(10px,2.8vw,14px)}
.brandline{position:relative;z-index:4;margin-top:7px;text-align:center;color:var(--azul);font-weight:800;font-size:clamp(10px,2.6vw,14px)}
.footer-wave{position:absolute;z-index:2;left:-6%;right:-6%;bottom:-24px;height:70px;background:var(--azul);transform:rotate(-2deg)}.footer-wave:before{content:"";position:absolute;left:-10%;top:-17px;width:72%;height:34px;background:var(--amarelo);transform:rotate(4deg)}
@media(max-width:430px){.page{padding-left:9px;padding-right:9px}.logo{width:min(286px,66vw);margin-top:0}.hero h1{font-size:clamp(34px,10vw,44px)}.subtitle{font-size:clamp(17px,4.8vw,21px)}.support{font-size:11px}.rule{margin:6px auto 4px}.card{width:98%;padding:10px 10px 9px;border-radius:23px;margin-top:9px}.card-title{font-size:19px;margin-bottom:6px}.quote{min-height:150px;max-height:29vh;padding:22px 14px 16px;border-radius:19px}#message{font-size:clamp(20px,6vw,27px)}#message.medium{font-size:clamp(17px,5.1vw,23px)}#message.long{font-size:clamp(14px,4.2vw,19px)}.ribbon-art{left:-74px;top:37%;width:330px;height:43%}.brandline{margin-top:5px}}
@media(max-height:760px){.logo{width:min(250px,60vw)}.hero h1{font-size:clamp(31px,8.8vw,41px)}.subtitle{font-size:15px}.support{font-size:10px}.rule{margin:4px auto 3px}.card{margin-top:7px}.quote{min-height:130px;max-height:27vh}#message{font-size:clamp(18px,5vw,24px)}#message.medium{font-size:clamp(16px,4.5vw,21px)}#message.long{font-size:clamp(13px,3.8vw,18px)}.tomorrow{font-size:10px}.brandline{font-size:9px}.ribbon-art{top:38%;height:38%}}
@media(min-width:800px){.logo{width:340px}.card{margin-top:22px}.quote{min-height:210px}.ribbon-art{left:-35px;width:470px}}
</style>
</head>

<script>
const messages={{ messages|tojson }};const el=document.getElementById('message');function deviceId(){let x=localStorage.getItem('valente_msg_device');if(!x){x=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'dev-'+Date.now()+'-'+Math.random();localStorage.setItem('valente_msg_device',x)}return x}function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}const today=dayKey(),key='valente_msg_daily_'+today;let saved=null;try{saved=JSON.parse(localStorage.getItem(key))}catch(e){}let text='Você importa. Cuide de você e permita-se receber cuidado também.';if(saved&&saved.text){text=saved.text}else if(messages.length){const chosen=messages[hash(deviceId()+'|'+today)%messages.length];text=chosen.text;localStorage.setItem(key,JSON.stringify(chosen))}el.textContent=text;if(text.length>210)el.classList.add('long');else if(text.length>135)el.classList.add('medium');
