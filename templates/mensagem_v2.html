<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff6d7">
<title>Mensagem do Dia | Saúde Valente</title>
<style>
:root{--azul:#073d7c;--amarelo:#f3b700;--fundo:#fff6d7;--texto:#17263a;--cinza:#737373}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--fundo);font-family:Arial,Helvetica,sans-serif;color:var(--texto)}body{overflow-x:hidden}
.page{width:min(760px,100%);min-height:100dvh;margin:auto;padding:max(10px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,#fff8df 0%,#fff1c8 100%);position:relative;overflow:hidden}
.logo{display:block;width:min(330px,74vw);height:auto;object-fit:contain;margin:0 auto 8px;border:0}
.hero{text-align:center;width:100%;position:relative;z-index:2}.hero h1{margin:0;color:var(--azul);font-size:clamp(42px,10.8vw,72px);line-height:.88;letter-spacing:-.05em;font-weight:950;text-transform:uppercase}.hero h1 span{display:block}.rule{display:flex;align-items:center;gap:12px;width:min(620px,88vw);margin:14px auto 10px}.rule:before,.rule:after{content:"";height:3px;background:var(--amarelo);flex:1}.rule b{color:var(--amarelo);font-size:30px;line-height:1}.subtitle{margin:0;color:var(--azul);font-size:clamp(22px,5.2vw,34px);line-height:1.08;font-weight:900}.support{margin:9px 0 0;color:var(--azul);font-size:clamp(14px,3.5vw,20px);line-height:1.2}.support strong{font-weight:900}
.card{width:min(680px,96%);margin-top:18px;padding:16px 18px 13px;border:2px solid rgba(215,166,20,.60);border-radius:34px;background:rgba(255,255,255,.94);box-shadow:0 12px 30px rgba(115,82,0,.10);position:relative;z-index:3}.card-title{display:flex;align-items:center;gap:14px;color:var(--azul);font-size:clamp(24px,5.8vw,38px);font-weight:950;white-space:nowrap;margin:0 0 12px}.card-title:before,.card-title:after{content:"";height:3px;background:var(--amarelo);flex:1}.quote{position:relative;min-height:clamp(210px,32vh,330px);display:flex;align-items:center;justify-content:center;padding:42px 26px 26px;border:2px solid rgba(215,166,20,.58);border-radius:30px;background:linear-gradient(145deg,#fffdf4 0%,#ffeaa8 100%);overflow:hidden}.quote:before{content:'“';position:absolute;left:28px;top:8px;color:var(--amarelo);font:900 76px/1 Georgia,serif}#message{margin:0;max-width:560px;text-align:center;color:#142235;font-size:clamp(26px,6.2vw,40px);font-weight:950;line-height:1.11;letter-spacing:-.025em}#message.medium{font-size:clamp(22px,5.2vw,34px)}#message.long{font-size:clamp(18px,4.5vw,29px)}.tomorrow{text-align:center;margin:12px 0 0;color:var(--cinza);font-size:clamp(13px,3.2vw,18px)}
.footer{width:112%;height:88px;margin-top:auto;background:var(--azul);position:relative;transform:rotate(-1.2deg);left:0;bottom:-38px}.footer:before{content:"";position:absolute;left:-3%;top:-20px;width:60%;height:38px;background:var(--amarelo);transform:rotate(2.5deg)}
@media(max-width:430px){.page{padding-left:8px;padding-right:8px}.logo{width:min(310px,78vw);margin-bottom:6px}.hero h1{font-size:clamp(40px,11.5vw,50px)}.rule{margin:10px auto 8px}.rule b{font-size:27px}.subtitle{font-size:21px}.support{font-size:14px}.card{width:97%;margin-top:14px;padding:13px 10px 11px;border-radius:28px}.card-title{font-size:22px;gap:10px;margin-bottom:10px}.quote{min-height:clamp(190px,29vh,270px);padding:38px 17px 22px;border-radius:24px}.quote:before{left:20px;top:5px;font-size:66px}#message{font-size:clamp(25px,7vw,32px)}#message.medium{font-size:clamp(21px,5.9vw,27px)}#message.long{font-size:clamp(17px,4.8vw,22px)}.tomorrow{font-size:13px;margin-top:10px}.footer{height:78px;bottom:-35px}}
@media(max-height:760px){.page{padding-top:5px}.logo{width:250px;max-height:15vh}.hero h1{font-size:36px}.rule{margin:6px auto 5px}.subtitle{font-size:17px}.support{font-size:11px}.card{margin-top:8px;padding-top:9px}.card-title{font-size:19px;margin-bottom:6px}.quote{min-height:145px;height:25vh;padding-top:28px}.quote:before{font-size:52px}#message{font-size:24px}#message.medium{font-size:20px}#message.long{font-size:17px}.tomorrow{font-size:11px;margin-top:6px}}
</style>
</head>
<body>
<main class="page">
<img class="logo" src="{{ url_for('static', filename='logo-setembro-site.jpg') }}?v=20260822-1255" alt="Secretaria da Saúde - Prefeitura de Valente">
<section class="hero">
<h1><span>SETEMBRO</span><span>AMARELO</span></h1>
<div class="rule"><b>♥</b></div>
<p class="subtitle">Prevenção do suicídio<br>e valorização da vida</p>
<p class="support">Você importa. Sua vida tem valor. <strong>Estamos com você.</strong></p>
</section>
<section class="card">
<div class="card-title">Sua mensagem do dia</div>
<div class="quote"><p id="message">Carregando sua mensagem...</p></div>
<p class="tomorrow">Amanhã você recebe uma nova mensagem.</p>
</section>
<div class="footer" aria-hidden="true"></div>
</main>
<script>
const messages={{ messages|tojson }};const el=document.getElementById('message');
function key(){let k=localStorage.getItem('mensagem_device_key');if(!k){k=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now());localStorage.setItem('mensagem_device_key',k)}return k}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
if(messages.length){const m=messages[hash(key()+'|'+day)%messages.length].text;el.textContent=m;el.className=m.length>190?'long':m.length>125?'medium':''}else el.textContent='Você importa. Sua vida tem valor.';
</script>
</body>
</html>
