<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sua mensagem do dia</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff3cf;color:#123e73}.page{min-height:100vh;background:linear-gradient(180deg,#fff3cf 0%,#fff8df 100%);padding:14px 26px 110px;position:relative;overflow:hidden}.logo{display:block;width:min(410px,78vw);height:auto;margin:0 auto 12px}.hero{text-align:center}.hero h1{margin:0;color:#0d437d;font-size:clamp(42px,8.2vw,68px);font-weight:900;line-height:.9;letter-spacing:-2px}.hero h1 span{display:block}.rule{display:flex;align-items:center;gap:18px;margin:20px auto 15px;max-width:585px;color:#f4b900}.rule:before,.rule:after{content:"";height:4px;background:#f4b900;flex:1}.rule b{font-size:34px;line-height:1}.subtitle{font-weight:900;font-size:clamp(24px,4.8vw,34px);line-height:1.05;margin:0 0 8px}.support{font-size:clamp(16px,3.4vw,22px);margin:0 auto 14px}.card{max-width:660px;margin:0 auto;background:#fffdf7;border:2px solid #e6c95b;border-radius:40px;padding:22px 18px 16px;text-align:center;box-shadow:0 4px 12px #cba93a22}.card-title{font-size:clamp(29px,5.6vw,40px);font-weight:900;display:flex;align-items:center;gap:18px;white-space:nowrap}.card-title:before,.card-title:after{content:"";height:4px;background:#e6b900;flex:1}.quote{margin-top:16px;border:2px solid #e5c95e;border-radius:34px;background:linear-gradient(135deg,#fffbea,#ffeaa0);padding:48px 28px 35px;min-height:280px;display:flex;align-items:center;justify-content:center;position:relative}.quote:before{content:"“";position:absolute;left:34px;top:6px;color:#f2b800;font-size:82px;font-weight:900;line-height:1}.quote p{margin:0;color:#18263a;font-size:clamp(28px,5.3vw,42px);line-height:1.13;font-weight:900}.tomorrow{color:#707070;font-size:clamp(16px,3.2vw,21px);margin:14px 0 0}.footer-shape{position:absolute;left:0;right:0;bottom:0;height:100px;background:#0c447d;clip-path:polygon(0 35%,63% 55%,63% 48%,100% 40%,100% 100%,0 100%)}.footer-shape:before{content:"";position:absolute;left:0;top:0;width:63%;height:50px;background:#f7b900;transform:rotate(2deg);transform-origin:left top}
@media(max-width:520px){.page{padding:14px 26px 100px}.logo{width:78vw;margin-bottom:10px}.card{border-radius:36px}.card-title{gap:12px}.quote{padding:45px 22px 30px;min-height:280px}}
</style>
</head>
<body>
<main class="page">
<img class="logo" src="/static/logo-cartaz-setembro-amarelo.jpg?v=20260822-1238" alt="Secretaria da Saúde - Prefeitura de Valente">
<section class="hero">
<h1><span>SETEMBRO</span><span>AMARELO</span></h1>
<div class="rule"><b>♥</b></div>
<p class="subtitle">Prevenção do suicídio<br>e valorização da vida</p>
<p class="support">Você importa. Sua vida tem valor. <strong>Estamos com você.</strong></p>
</section>
<section class="card">
<div class="card-title">Sua mensagem do dia</div>
<div class="quote"><p id="message">Carregando sua mensagem...</p></div>
<p class="tomorrow">Amanhã você recebe uma nova mensagem.</p>
</section>
<div class="footer-shape"></div>
</main>
<script>
const FALLBACK=["Você merece ser ouvido com respeito e sem julgamento. Procure alguém de confiança e converse se precisar.","Você não precisa ter todas as respostas hoje. Reserve um instante para respirar e perceber como você está.","Seu esforço de continuar já diz muita coisa sobre você. Cuide do que está ao seu alcance agora."];
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const d=new Date(),key=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;let device=localStorage.getItem('msg_device');if(!device){device=Math.random().toString(36).slice(2)+Date.now();localStorage.setItem('msg_device',device)}
fetch('/api/mensagem').then(r=>r.ok?r.json():Promise.reject()).then(data=>{const arr=Array.isArray(data)?data:(data.frases||data.mensagens||[]);document.getElementById('message').textContent=arr.length?arr[hash(device+key)%arr.length]:FALLBACK[hash(device+key)%FALLBACK.length]}).catch(()=>document.getElementById('message').textContent=FALLBACK[hash(device+key)%FALLBACK.length]);
</script>
</body>
</html>
