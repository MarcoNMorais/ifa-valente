<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sua mensagem do dia</title>
<style>
:root{--azul:#0d437d;--amarelo:#f4b900;--fundo:#fff3cf;--texto:#18263a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:var(--fundo);color:var(--azul)}
.page{width:min(760px,100%);height:100dvh;min-height:100svh;margin:auto;background:linear-gradient(180deg,#fff3cf 0%,#fff8df 100%);padding:max(6px,env(safe-area-inset-top)) 12px max(58px,env(safe-area-inset-bottom));position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.logo{display:block;width:min(285px,66vw);max-height:18vh;height:auto;object-fit:contain;margin:0 auto 2px;flex:0 0 auto}
.hero{text-align:center;width:100%;flex:0 0 auto}.hero h1{margin:0;color:var(--azul);font-size:clamp(32px,8vw,48px);font-weight:900;line-height:.88;letter-spacing:-1.5px}.hero h1 span{display:block}
.rule{display:flex;align-items:center;gap:12px;width:min(520px,88vw);margin:8px auto 6px;color:var(--amarelo)}.rule:before,.rule:after{content:"";height:3px;background:var(--amarelo);flex:1}.rule b{font-size:27px;line-height:1}
.subtitle{font-weight:900;font-size:clamp(17px,4.1vw,25px);line-height:1.04;margin:0 0 4px}.support{font-size:clamp(11px,2.8vw,16px);margin:0 auto 7px}
.card{width:min(650px,96%);margin:0 auto;background:#fffdf7;border:2px solid #e6c95b;border-radius:28px;padding:10px 12px 8px;text-align:center;box-shadow:0 4px 12px #cba93a22;flex:0 0 auto}
.card-title{font-size:clamp(20px,4.7vw,30px);font-weight:900;display:flex;align-items:center;gap:10px;white-space:nowrap}.card-title:before,.card-title:after{content:"";height:3px;background:#e6b900;flex:1}
.quote{margin-top:8px;border:2px solid #e5c95e;border-radius:24px;background:linear-gradient(135deg,#fffbea,#ffeaa0);padding:30px 18px 20px;height:clamp(155px,26vh,220px);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.quote:before{content:"“";position:absolute;left:22px;top:0;color:#f2b800;font-size:58px;font-weight:900;line-height:1}.quote p{margin:0;color:var(--texto);font-size:clamp(20px,4.8vw,31px);line-height:1.08;font-weight:900;max-width:560px}
.quote p.medium{font-size:clamp(18px,4.25vw,27px)}.quote p.long{font-size:clamp(15px,3.7vw,23px)}
.tomorrow{color:#707070;font-size:clamp(11px,2.7vw,16px);margin:7px 0 0}
.footer-shape{position:absolute;left:0;right:0;bottom:0;height:55px;background:#0c447d;clip-path:polygon(0 22%,60% 38%,60% 32%,100% 26%,100% 100%,0 100%)}.footer-shape:before{content:"";position:absolute;left:0;top:0;width:61%;height:28px;background:#f7b900;transform:rotate(2deg);transform-origin:left top}
@media(max-width:520px){.page{padding-left:10px;padding-right:10px}.logo{width:min(270px,68vw);max-height:17vh}.hero h1{font-size:clamp(31px,8.6vw,40px)}.rule{margin:6px auto 5px}.subtitle{font-size:clamp(16px,4.4vw,20px)}.support{font-size:clamp(10px,2.9vw,13px);margin-bottom:6px}.card{width:98%;border-radius:24px;padding:9px 9px 7px}.card-title{font-size:clamp(18px,5vw,22px);gap:8px}.quote{height:clamp(145px,25vh,200px);padding:26px 12px 16px;border-radius:20px}.quote p{font-size:clamp(19px,5.6vw,25px)}.quote p.medium{font-size:clamp(16px,4.9vw,21px)}.quote p.long{font-size:clamp(14px,4.15vw,18px)}.quote:before{font-size:50px;left:16px}.tomorrow{font-size:11px}}
@media(max-height:760px){.logo{width:220px;max-height:14vh}.hero h1{font-size:30px}.rule{margin:4px auto}.subtitle{font-size:15px}.support{font-size:10px}.card{padding:7px 8px 6px}.card-title{font-size:17px}.quote{height:20vh;min-height:125px;margin-top:6px;padding:22px 10px 13px}.quote p{font-size:19px}.quote p.medium{font-size:16px}.quote p.long{font-size:14px}.tomorrow{font-size:10px;margin-top:5px}}
</style>
</head>
<body>
<main class="page">
<img class="logo" src="/static/logo-cartaz-setembro-amarelo.svg?v=20260822-1623" alt="Secretaria da Saúde - Prefeitura de Valente">
<section class="hero">
<h1><span>SETEMBRO</span><span>AMARELO</span></h1>
<div class="rule"><b>♥</b></div>
<p class="subtitle">Prevenção do suicídio<br>e valorização da vida</p>
<p class="support">Você importa. Sua vida tem valor. <strong>Estamos com você.</strong></p>
</section>
<section class="card">
<div class="card-title">Sua mensagem do dia</div>
<div class="quote"><p id="message">Carregando sua mensagem...</p></div>
<p class="tomorrow">Amanhã você recebe uma nova mensagem.</p>
</section>
<div class="footer-shape"></div>
</main>
<script>
const messages={{ messages|tojson }};
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function setMessage(m){const el=document.getElementById('message');el.textContent=m;el.className=m.length>165?'long':m.length>105?'medium':''}
let device=localStorage.getItem('msg_device');
if(!device){device=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()).replace(/[^a-zA-Z0-9_-]/g,'');localStorage.setItem('msg_device',device)}
const d=new Date(),day=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
if(messages.length){setMessage(messages[hash(device+'|'+day)%messages.length].text)}else{setMessage('Você importa. Sua vida tem valor.')}
const origem=(new URLSearchParams(location.search).get('origem')||'DIRETO').toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,60)||'DIRETO';
fetch('/mensagem/registrar?origem='+encodeURIComponent(origem)+'&v='+encodeURIComponent(device),{cache:'no-store'}).catch(()=>{});
</script>
</body>
</html>
