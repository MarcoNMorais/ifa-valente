<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7d8">
<title>Mensagem do Dia | Saúde Valente</title>
<style>
:root{--azul:#073b79;--azul2:#0b4b8f;--amarelo:#f4b400;--ouro:#e4a500;--creme:#fff7d6;--texto:#172536}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto)}
body{background:radial-gradient(circle at 5% 5%,rgba(244,180,0,.12),transparent 26%),linear-gradient(180deg,#fffdf7 0%,#fff5c9 100%);overflow-x:hidden}
.page{position:relative;width:min(720px,100%);min-height:100svh;margin:auto;padding:10px 16px 12px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.page:before{content:"";position:absolute;width:260px;height:260px;border:2px solid rgba(244,180,0,.20);border-radius:50%;left:-170px;top:-150px}
.dots{position:absolute;right:18px;top:14px;width:72px;height:72px;opacity:.34;background-image:radial-gradient(var(--amarelo) 2px,transparent 2px);background-size:14px 14px}
.logo-wrap{position:relative;z-index:2;text-align:center;margin:0 auto 4px}
.logo{display:block;width:min(255px,63vw);height:auto;margin:auto;object-fit:contain}
.hero{text-align:center;position:relative;z-index:2;margin:0 auto 7px}
.mini-ribbon{font-size:32px;line-height:1;margin:0 0 -2px;filter:saturate(1.08)}
.hero h1{margin:0;font-size:clamp(31px,7vw,48px);line-height:.96;letter-spacing:-1.8px;font-weight:900;color:var(--azul);text-transform:uppercase}
.hero h1 span{color:var(--amarelo)}
.divider{display:flex;align-items:center;justify-content:center;gap:9px;margin:6px auto 4px;width:min(390px,80vw)}
.divider:before,.divider:after{content:"";height:2px;background:linear-gradient(90deg,transparent,var(--amarelo));flex:1}.divider:after{background:linear-gradient(90deg,var(--amarelo),transparent)}
.heart{color:var(--amarelo);font-size:18px;line-height:1}
.subtitle{margin:0;color:var(--azul);font-size:clamp(16px,3.6vw,22px);line-height:1.08;font-weight:800}
.support{margin:3px 0 0;font-size:clamp(11px,2.8vw,15px);font-weight:650;color:#3c5572}
.card{position:relative;z-index:2;background:rgba(255,255,255,.94);border:1px solid rgba(228,165,0,.45);border-radius:26px;padding:14px 18px 13px;box-shadow:0 12px 34px rgba(96,68,0,.10);overflow:hidden}
.card-title{display:flex;align-items:center;gap:11px;color:var(--azul);font-weight:900;font-size:clamp(18px,4.5vw,26px);margin:0 0 9px;white-space:nowrap}.card-title:before,.card-title:after{content:"";height:2px;background:var(--amarelo);flex:1}
.quote{position:relative;min-height:230px;max-height:42svh;border:1px solid rgba(228,165,0,.48);border-radius:22px;background:linear-gradient(145deg,#fffaf0,#fff0b4);display:flex;align-items:center;justify-content:center;padding:28px 24px 24px;overflow:hidden}
.quote:before{content:'“';position:absolute;top:0;left:18px;color:var(--amarelo);font:700 62px/1 Georgia,serif}
.ribbon-watermark{position:absolute;right:-8px;bottom:-24px;font-size:112px;line-height:1;opacity:.055;transform:rotate(-8deg);pointer-events:none}
#message{position:relative;z-index:2;margin:0;text-align:center;font-weight:850;font-size:clamp(22px,5.2vw,32px);line-height:1.22;letter-spacing:-.5px;color:#172536;max-width:560px}
#message.medium{font-size:clamp(19px,4.7vw,28px)}#message.long{font-size:clamp(16px,4vw,23px);line-height:1.2}
.tomorrow{text-align:center;color:#6f706d;margin:9px 0 0;font-size:clamp(11px,2.9vw,14px)}
.footer-wave{position:absolute;z-index:1;left:-8%;right:-8%;bottom:-22px;height:68px;background:var(--azul);transform:rotate(-2deg);transform-origin:center}.footer-wave:before{content:"";position:absolute;left:-5%;top:-14px;width:70%;height:30px;background:var(--amarelo);transform:rotate(4deg)}
.brandline{position:relative;z-index:2;text-align:center;color:var(--azul);font-weight:800;font-size:11px;margin:7px 0 4px}
@media(max-width:430px){.page{padding:6px 10px 9px;justify-content:flex-start}.logo{width:min(222px,60vw)}.logo-wrap{margin-bottom:1px}.mini-ribbon{font-size:27px}.hero h1{font-size:clamp(28px,8.4vw,38px)}.divider{margin:4px auto 3px}.subtitle{font-size:clamp(15px,4.3vw,19px)}.support{font-size:11px}.hero{margin-bottom:6px}.card{border-radius:23px;padding:11px 11px 10px}.card-title{font-size:19px;margin-bottom:7px}.quote{min-height:205px;max-height:43svh;border-radius:19px;padding:25px 14px 18px}#message{font-size:clamp(21px,6.2vw,28px)}#message.medium{font-size:clamp(18px,5.4vw,24px)}#message.long{font-size:clamp(15px,4.4vw,20px)}.tomorrow{margin-top:7px}.brandline{margin-top:5px}}
@media(max-height:790px) and (max-width:600px){.page{padding-top:4px}.logo{width:min(190px,53vw)}.mini-ribbon{font-size:23px}.hero h1{font-size:clamp(25px,7.4vw,34px)}.subtitle{font-size:14px}.support{font-size:10px}.divider{margin:3px auto 2px}.card{padding:9px 10px 8px}.card-title{font-size:17px;margin-bottom:6px}.quote{min-height:175px;max-height:39svh;padding:22px 12px 15px}#message{font-size:clamp(19px,5.5vw,25px)}#message.medium{font-size:clamp(17px,4.8vw,22px)}#message.long{font-size:clamp(14px,4vw,18px)}.tomorrow{font-size:10px;margin-top:5px}.brandline{font-size:9px;margin-top:3px}}
@media(min-width:760px){body{background:linear-gradient(135deg,#fffdf7,#fff3c0)}.page{padding:20px 24px}.quote{min-height:250px}.logo{width:280px}}
</style>
</head>
<body>
<main class="page">
  <div class="dots" aria-hidden="true"></div>
  <div class="logo-wrap"><img class="logo" src="{{ url_for('static', filename='logo-saude-valente.jpg') }}?v=20260821-2231" alt="Secretaria da Saúde - Prefeitura de Valente"></div>
  <section class="hero">
    <div class="mini-ribbon" aria-hidden="true">🎗️</div>
    <h1>Setembro <span>Amarelo</span></h1>
    <div class="divider"><span class="heart">♥</span></div>
    <p class="subtitle">Prevenção do suicídio e valorização da vida</p>
    <p class="support">Você importa. Sua vida tem valor. <strong>Estamos com você.</strong></p>
  </section>
  <section class="card">
    <div class="card-title">Sua mensagem do dia</div>
    <div class="quote"><span class="ribbon-watermark" aria-hidden="true">🎗️</span><p id="message">Carregando...</p></div>
    <p class="tomorrow">Amanhã você recebe uma nova mensagem.</p>
  </section>
  <div class="brandline">Secretaria da Saúde • Prefeitura de Valente</div>
  <div class="footer-wave" aria-hidden="true"></div>
</main>
<script>
const messages={{ messages|tojson }};
const el=document.getElementById('message');
function deviceId(){let x=localStorage.getItem('valente_msg_device');if(!x){x=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'dev-'+Date.now()+'-'+Math.random();localStorage.setItem('valente_msg_device',x)}return x}
function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const today=dayKey(),key='valente_msg_daily_'+today;let saved=null;try{saved=JSON.parse(localStorage.getItem(key))}catch(e){}
let text='Você importa. Cuide de você e permita-se receber cuidado também.';
if(saved&&saved.text){text=saved.text}else if(messages.length){const chosen=messages[hash(deviceId()+'|'+today)%messages.length];text=chosen.text;localStorage.setItem(key,JSON.stringify(chosen))}
el.textContent=text;if(text.length>210)el.classList.add('long');else if(text.length>135)el.classList.add('medium');
</script>
</body>
</html>
