<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7c928">
<title>Mensagem do Dia | Saúde Valente</title>
<style>
:root{--blue:#083b79;--yellow:#f5c21b;--ink:#182333;--muted:#7a7f87;--cream:#fff9e8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
body{min-height:100vh;background:linear-gradient(180deg,#fffdf7 0%,#fff7d7 100%)}
.page{width:min(620px,100%);margin:0 auto;padding:18px 16px 26px;min-height:100vh;display:flex;flex-direction:column}
.logo{display:flex;justify-content:center;margin:0 0 10px}
.logo img{width:min(285px,76vw);height:auto;display:block;border-radius:8px}
.campaign{text-align:center;margin:4px 0 18px}
.campaign h1{margin:0;color:#d99c00;font-size:clamp(30px,8vw,46px);line-height:1.05;letter-spacing:-1px}
.campaign p{margin:7px 0 0;font-size:clamp(14px,3.7vw,18px);color:#4d5158}
.card{background:#fff;border-radius:30px;padding:28px 22px 22px;box-shadow:0 18px 50px rgba(112,82,0,.10);border:1px solid rgba(245,194,27,.26);text-align:center}
.label{font-size:16px;font-weight:700;color:var(--blue);letter-spacing:.2px;margin-bottom:15px}
.quote{position:relative;background:linear-gradient(145deg,#fff9e8,#fff1b9);border:1px solid rgba(245,194,27,.34);border-radius:24px;min-height:245px;padding:34px 22px;display:flex;align-items:center;justify-content:center}
.quote:before{content:'“';position:absolute;top:6px;left:18px;color:#e4a800;font:700 64px/1 Georgia,serif}
#message{margin:0;font-size:clamp(24px,6.4vw,34px);line-height:1.35;font-weight:780;letter-spacing:-.5px;color:#1c2734}
.tomorrow{margin:17px 0 0;color:#6f706d;font-size:13px}
.ribbon{font-size:30px;margin-bottom:8px}
.help{margin-top:auto;padding-top:18px;text-align:center;color:#77725f;font-size:12px;line-height:1.45}
.help strong{color:#5d5130}
@media(max-width:430px){.page{padding:12px 11px 20px}.logo img{width:min(255px,78vw)}.campaign{margin-bottom:13px}.card{padding:22px 14px 18px;border-radius:25px}.quote{min-height:225px;padding:30px 16px;border-radius:20px}.label{font-size:15px}}
</style>
</head>

  <section class="campaign">
    <div class="ribbon">🎗️</div>
    <h1>Setembro Amarelo</h1>
    <p>Prevenção do suicídio e valorização da vida</p>
  </section>

  <section class="card">
    <div class="label">Sua mensagem do dia</div>
    <div class="quote"><p id="message">Carregando...</p></div>
    <div class="tomorrow">Amanhã você recebe uma nova mensagem.</div>
  </section>

  <div class="help">Se precisar conversar, procure alguém de confiança ou um profissional de saúde. <strong>CVV 188</strong>.</div>
</main>
<script>
const messages={{ messages|tojson }};
const el=document.getElementById('message');
function makeId(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return'dev-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function localDateKey(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function hashText(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
let deviceId=localStorage.getItem('valente_msg_device');if(!deviceId){deviceId=makeId();localStorage.setItem('valente_msg_device',deviceId)}
const today=localDateKey(),storageKey='valente_msg_daily_'+today;let saved=null;try{saved=JSON.parse(localStorage.getItem(storageKey))}catch(e){}
if(saved&&saved.text){el.textContent=saved.text}else if(messages.length){const idx=hashText(deviceId+'|'+today)%messages.length,chosen=messages[idx];el.textContent=chosen.text;localStorage.setItem(storageKey,JSON.stringify(chosen))}else{el.textContent='Você importa. Cuide de você e permita-se receber cuidado também.'}
</script>
