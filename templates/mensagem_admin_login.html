<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | Painel Mensagem do Dia</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#fff3cf,#fff8df);color:#17385f;padding:20px}.box{width:min(420px,100%);background:#fff;border:1px solid #ead990;border-radius:24px;padding:28px;box-shadow:0 14px 38px rgba(43,57,77,.12)}h1{margin:0 0 6px;color:#0d437d;font-size:28px}.sub{margin:0 0 22px;color:#6c7480;font-size:14px}.field{margin-bottom:14px}label{display:block;font-weight:700;margin-bottom:6px}input{width:100%;padding:13px 14px;border:1px solid #cfd6df;border-radius:12px;font-size:16px;outline:none}input:focus{border-color:#0d437d;box-shadow:0 0 0 3px rgba(13,67,125,.10)}button{width:100%;border:0;border-radius:12px;padding:13px;background:#0d437d;color:white;font-size:16px;font-weight:800;cursor:pointer}.error{background:#fff1f1;color:#a51d1d;border:1px solid #f0c2c2;border-radius:10px;padding:10px 12px;margin-bottom:14px}.back{display:block;text-align:center;margin-top:14px;color:#0d437d;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="box">
<h1>Painel Mensagem do Dia</h1>
<p class="sub">Acesso separado do sistema IFA.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="field"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" required></div>
<div class="field"><label for="password">Senha</label><input id="password" type="password" name="password" autocomplete="current-password" required></div>
<button type="submit">Entrar</button>
</form>
<a class="back" href="{{ url_for('mensagem_do_dia') }}">Voltar para a mensagem do dia</a>
</div>
</body>
</html>
