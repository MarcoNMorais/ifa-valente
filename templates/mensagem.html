<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff9df">
<title>Mensagem do Dia | Saúde Valente</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(180deg,#fffdf7,#fff6c9);color:#172333}.wrap{max-width:680px;margin:auto;padding:10px 14px 28px}.logo{display:block;width:min(330px,84vw);height:auto;margin:0 auto 6px;border-radius:10px}.campaign{text-align:center;margin:4px 0 18px}.ribbon{font-size:42px;line-height:1}.campaign h1{margin:6px 0;color:#d99b00;font-size:clamp(32px,8vw,48px);line-height:1.05}.sub{margin:8px 0 0;color:#555;font-size:clamp(16px,4vw,19px)}.card{background:#fff;border:1px solid #efd66a;border-radius:28px;padding:24px 18px;box-shadow:0 12px 40px rgba(143,116,0,.10)}.title{text-align:center;color:#073b79;font-weight:800;font-size:clamp(24px,6vw,33px);margin-bottom:20px}.quote{position:relative;min-height:220px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff9e8,#fff0b6);border:1px solid #efd66a;border-radius:24px;padding:30px 22px}.quote:before{content:'“';position:absolute;left:18px;top:3px;font:64px Georgia;color:#e3a500}#message{margin:14px 0 0;text-align:center;font-size:clamp(23px,5.7vw,34px);line-height:1.35;font-weight:800}.tom{text-align:center;color:#777;margin:20px 0 2px;font-size:16px}.deploy-mark{text-align:center;font-size:11px;color:#b59624;margin:9px 0 0;letter-spacing:.3px}@media(max-width:420px){.wrap{padding:8px 10px 22px}.card{padding:22px 12px}.quote{min-height:210px}.logo{width:88vw}}
</style>
</head>
<body>
<main class="wrap">
<img class="logo" src="{{ url_for('static', filename='logo-saude-valente.jpg') }}" alt="Secretaria da Saúde - Prefeitura de Valente">
<section class="campaign"><div class="ribbon">🎗️</div><h1>Setembro Amarelo</h1><p class="sub">Prevenção do suicídio e valorização da vida</p></section>
<section class="card"><div class="title">Sua mensagem do dia</div><div class="quote"><p id="message">Carregando...</p></div><div class="tom">Amanhã você recebe uma nova mensagem.</div><div class="deploy-mark">• versão 20:32 •</div></section>
</main>
<script>
const messages={{ messages|tojson }};const el=document.getElementById('message');function deviceId(){let x=localStorage.getItem('valente_msg_device');if(!x){x=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'dev-'+Date.now()+'-'+Math.random();localStorage.setItem('valente_msg_device',x)}return x}function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}const today=dayKey(),key='valente_msg_daily_'+today;let saved=null;try{saved=JSON.parse(localStorage.getItem(key))}catch(e){}if(saved&&saved.text){el.textContent=saved.text}else if(messages.length){const chosen=messages[hash(deviceId()+'|'+today)%messages.length];el.textContent=chosen.text;localStorage.setItem(key,JSON.stringify(chosen))}else{el.textContent='Você importa. Cuide de você e permita-se receber cuidado também.'}
</script>
</body>
</html>
